project:
  type: book
  output-dir: docs

number-depth: 2

book:
  title: "COMP/STAT 212 Portfolio"
  author: "Elma Mostic"
  date: today
  date-format: full
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  cookie-consent:
    type: implied
    style: simple

  sidebar:
    title: "Elma Mostic"
    collapse-level: 2
    style: "docked"
    pinned: true
    search: true

  chapters:
    - text: "Welcome"
      href: index.qmd

    - part: "In-Class Activities"
      chapters:
      - ica/ica-sample1.qmd
      - ica/ica-sample2.qmd
      - ica/04-adv-maps-1-notes.qmd
      - ica/06-wrangling-1-notes.qmd
      - ica/07-wrangling-2-notes.qmd
      - ica/08-missing-data-notes.qmd
      - ica/09-functions-notes.qmd
      - ica/10-base-r-notes.qmd
      - ica/11-iteration-1-notes.qmd
      - ica/12-iteration-2-notes.qmd
      - ica/14-apis-2-notes.qmd
      - ica/15-scraping-notes.qmd
      - ica/16-databases-notes.qmd
      - ica/18-interactive-viz-notes.qmd

    - part: "Pre-Class Learnings"
      chapters:
      - pcl/pcl.qmd

format:
  html:
    theme:
      light: [flatly, style/custom.css]
      dark:  [darkly, style/custom.css]
    search: true
    toc: true
    toc-depth: 3
    toc-title: "on this page"
    link-external-newwindow: true
    fontsize: 1em
    smooth-scroll: true
    code-overflow: scroll
    code-copy: true
    code-link: true
    code-line-numbers: true
    code-block-bg: true
    code-block-border-left: "#E8C94A"
    code-tools: true
    page-layout: full
    code-fold: true
    number-sections: false
    toc-expand: true
    fig-align: center
    fig-cap-location: bottom

execute:
  echo: true
  warning: false
  error: true
  cache: false

editor:
  mode: source
  markdown:
    wrap: sentence
